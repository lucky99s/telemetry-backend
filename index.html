<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chinese Bot Dashboard</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100"><main class="max-w-6xl mx-auto p-6"><h1 class="text-3xl font-bold">Chinese Bot</h1><p class="text-slate-400 mb-6">Device diagnostics dashboard</p><section class="bg-slate-900 rounded-xl p-4 mb-6"><h2 class="text-xl font-semibold mb-3">Connected Devices</h2><div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-400"><th class="p-2">UUID</th><th>Model</th><th>Android</th><th>IP</th><th>Status</th></tr></thead><tbody id="devices"></tbody></table></div></section><section class="bg-slate-900 rounded-xl p-4"><h2 class="text-xl font-semibold mb-3">Live Activity</h2><div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-400"><th class="p-2">Time</th><th>Device</th><th>Package</th><th>Message</th></tr></thead><tbody id="events"></tbody></table></div></section></main><script>
const devicesEl=document.querySelector('#devices'),eventsEl=document.querySelector('#events');
function renderDevices(ds){devicesEl.innerHTML=ds.map(d=>`<tr class="border-t border-slate-800"><td class="p-2 font-mono">${esc(d.uuid)}</td><td>${esc(d.model)}</td><td>${esc(d.androidVersion)}</td><td>${esc(d.ip||'')}</td><td><span class="inline-block w-2.5 h-2.5 rounded-full ${d.active?'bg-green-400':'bg-red-400'}"></span> ${d.active?'Active':'Disconnected'}</td></tr>`).join('')}
function addEvent(e){const tr=document.createElement('tr');tr.className='border-t border-slate-800';tr.innerHTML=`<td class="p-2">${new Date(e.timestamp).toLocaleString()}</td><td class="font-mono">${esc(e.deviceUuid)}</td><td>${esc(e.packageName)}</td><td>${esc(e.text)}</td>`;eventsEl.prepend(tr);while(eventsEl.children.length>200)eventsEl.lastChild.remove()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fetch('/api/devices').then(r=>r.json()).then(renderDevices);fetch('/api/events').then(r=>r.json()).then(a=>a.reverse().forEach(addEvent));
const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='devices')renderDevices(m.devices);if(m.type==='event')addEvent(m.event)};
</script></body></html>
